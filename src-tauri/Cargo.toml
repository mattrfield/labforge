[package]
name = "labforge"
version = "0.2.0"
description = "Local, hands-on cybersecurity lab launcher"
edition = "2021"

[lib]
name = "labforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
semver = "1"
tar = "0.4"
base64 = "0.22"
minisign-verify = "0.3"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt"] }
